# 미리보기·원본 히트 시 PHP 우회 — Nginx Proxy Manager proxy host 33 의 Advanced 탭 내용
#
# 적용: NPM UI > Hosts > Proxy Hosts > images-dev.connple.com / images.connple.com
#       > Edit > Advanced. UI 밖에서 /data/nginx/proxy_host/33.conf 를 직접 고치면
#       해당 호스트를 저장하는 순간 재생성되어 사라진다.
#
# 전제 (2026-08-28 실측):
#   - MinIO 192.168.0.254:9000 에 NPM 박스에서 접근 가능
#   - preview 오브젝트가 익명 읽기 200 (orderhow/seekle/eco). dolpin/disclo-bot 은
#     403 이지만 폴백으로 정상 동작한다
#   - preview 키는 previews/{w}x{h}[!]/{md5앞2}/{md5(경로)}.webp 로 결정적이다
#
# 2026-08-28 운영 적용 완료. 검증 기간에 두 블록의 rewrite_by_lua_block 에 두었던
# $host 검사(images-dev 한정)는 제거된 상태다.
#
# 미리보기 우회는 앱이 md5(bucket + preview경로) 를 ETag 로 쓰는 것을 전제한다
# (ImageService::previewETag, 커밋 4ba5a82). 그 이전 코드로 롤백하면 앱은
# md5(바이트+size) 를 내보내 우회 경로와 ETag 가 갈라지므로, 코드를 되돌릴 때는
# 이 블록도 함께 비활성화할 것. 원본 우회는 MinIO 의 내용 기반 ETag 를 쓰므로 무관하다.

# ── 1. 미리보기 히트 시 PHP 우회 ──
location ~ "^/(?<img_bucket>[^/.][^/]*)/(?<img_size>[0-9]+x[0-9]+[c!]?)/(?<img_object>.+)$" {
    set $img_preview '';
    set $img_etag '';

    rewrite_by_lua_block {
        if ngx.var.host ~= "images-dev.connple.com" then
            return ngx.exec("@app")
        end

        local w, h, crop = string.match(ngx.var.img_size, "^(%d+)x(%d+)([c!]?)$")
        if not w then return ngx.exec("@app") end

        -- 앱은 (int) 캐스팅한 값을 경로에 쓴다. 0300 -> 300 을 맞춘다.
        local dim = tostring(tonumber(w)) .. "x" .. tostring(tonumber(h))
        if crop ~= "" then dim = dim .. "!" end

        local hash = ngx.md5(ngx.var.img_object)
        local key  = "previews/" .. dim .. "/" .. string.sub(hash, 1, 2) .. "/" .. hash .. ".webp"

        ngx.var.img_preview = "/" .. ngx.var.img_bucket .. "/" .. key
        -- ImageService::previewETag() 와 같은 식이어야 한다.
        ngx.var.img_etag    = ngx.md5(ngx.var.img_bucket .. "/" .. key)

        -- 헤더는 add_header 에만 맡긴다. 여기서 세팅하면 중복 출력된다.
        if ngx.var.http_if_none_match == ngx.var.img_etag then
            return ngx.exit(304)
        end
    }

    proxy_pass http://192.168.0.254:9000$img_preview;
    proxy_set_header Host 192.168.0.254:9000;
    proxy_set_header If-None-Match "";
    proxy_set_header If-Modified-Since "";
    proxy_set_header Authorization "";
    proxy_http_version 1.1;

    # 403(권한 없는 버킷)·404(미생성 preview)·5xx·연결 실패 전부 앱으로 넘긴다.
    proxy_intercept_errors on;
    error_page 403 404 500 502 503 504 = @app;

    proxy_hide_header Cache-Control;
    proxy_hide_header ETag;
    proxy_hide_header Server;
    proxy_hide_header Vary;
    proxy_hide_header X-Amz-Id-2;
    proxy_hide_header X-Amz-Request-Id;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Xss-Protection;
    proxy_hide_header X-Content-Type-Options;

    add_header Cache-Control "public, max-age=31536000" always;
    add_header ETag $img_etag always;
    add_header Vary "Accept" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Served-By $host always;
}

# ── 2. 원본 히트 시 PHP 우회 (반드시 1 다음에 올 것) ──
#
# nginx 는 regex location 을 작성 순서대로 시도하고 첫 매치를 채택한다.
# 이 블록이 1번보다 앞서면 리사이즈 URL 까지 잡아가 미리보기 우회가 무력화된다.
#
# 버킷을 [^/.] 로 시작하게 한 것은 /.well-known/acme-challenge/ 를 배제하기
# 위해서다. 이걸 빼면 인증서 자동 갱신이 깨진다. S3 버킷명은 점으로 시작할 수 없다.
location ~ "^/(?<org_bucket>[^/.][^/]*)/(?<org_rest>.+)$" {
    set $org_uri '';

    rewrite_by_lua_block {
        if ngx.var.host ~= "images-dev.connple.com" then
            return ngx.exec("@app")
        end
        -- 원본 키는 임의 문자를 포함할 수 있다. 디코딩된 $uri 대신
        -- request_uri 의 원본 인코딩을 그대로 넘겨야 깨지지 않는다.
        local raw = ngx.var.request_uri
        local q = string.find(raw, "?", 1, true)
        if q then raw = string.sub(raw, 1, q - 1) end
        ngx.var.org_uri = raw
    }

    proxy_pass http://192.168.0.254:9000$org_uri;
    proxy_set_header Host 192.168.0.254:9000;
    proxy_set_header Authorization "";
    proxy_http_version 1.1;

    proxy_intercept_errors on;
    error_page 403 404 500 502 503 504 = @app;

    # MinIO 가 원본에 Cache-Control 을 메타데이터로 저장하고 있다(업로드 앱이 설정).
    # 숨기지 않으면 아래 add_header 와 함께 두 번 나간다.
    proxy_hide_header Cache-Control;
    proxy_hide_header Server;
    proxy_hide_header Vary;
    proxy_hide_header X-Amz-Id-2;
    proxy_hide_header X-Amz-Request-Id;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Xss-Protection;
    proxy_hide_header X-Content-Type-Options;

    # ETag 는 숨기지 않는다. MinIO 값은 내용 기반이라 원본이 바뀌면 함께 바뀐다.
    # 앱은 원본에 ETag 를 붙이지 않으므로 이것 자체가 개선이다.
    add_header Cache-Control "public, max-age=31536000" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Served-By $host always;
}

# ── 3. 폴백 ──
# proxy.conf 가 proxy_pass 까지 포함하므로 location / 의 동작을 그대로 복제한다.
location @app {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    include /etc/nginx/conf.d/include/proxy.conf;
}
